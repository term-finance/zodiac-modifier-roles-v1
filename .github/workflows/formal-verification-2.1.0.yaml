# The open release: certora/2.1.0 compiles packages/evm/contracts as it is,
# the three guards included, so it proves the guards at the pushed commit and
# a change to them runs it. Once 2.1.0 is tagged, give it the tag fetch, guard
# pull and path filters of formal-verification-2.0.0.yaml.
name: Formal Verification 2.1.0
on:
  push:
    paths:
      - "packages/evm/certora/**"
      - "packages/evm/contracts/**"
      - "!packages/evm/certora/2.0.0/**"
      - "packages/evm/requirements*.txt"
      - "packages/evm/package.json"
      - "packages/evm/yarn.lock"
      - ".tool-versions"
      - ".github/workflows/formal-verification-2.1.0.yaml"
permissions:
  contents: read
concurrency:
  # Per-commit group on main so no main commit's verification is superseded by
  # a later push — every commit that lands gets its own prover run. Elsewhere,
  # a new push cancels the previous run for that branch.
  group: fv-2.1.0-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruleset:
          - "Roles-setTxNonceGuardAndRoleConfig.conf"
          - "Roles-configIntegrity.conf"
          - "Delay-pauseGuardSufficient.conf"
          - "Delay-moduleIntegrity.conf"
          - "Delay-queueProvenance.conf"
          - "PauseGuard-deployment.conf"
          - "Safe-executionPaths.conf"
          - "Safe-selfCalls.conf"
          - "Safe-noStateChange.conf"
          - "Safe-configLockGuard.conf"
          - "Safe-ownerlessSafeGuard.conf"
          - "Safe-v141-executionPaths.conf"
          - "Safe-v141-selfCalls.conf"
          - "Safe-v141-noStateChange.conf"
          - "Safe-v141-vetoLandsOnDelay.conf"
          - "Safe-v141-configLockGuard.conf"
          - "Safe-L2-v141-executionPaths.conf"
          - "Safe-L2-v141-selfCalls.conf"
          - "Safe-L2-v141-noStateChange.conf"
          - "Safe-L2-v141-configLockGuard.conf"
          - "Safe-L2-v141-ownerlessSafeGuard.conf"
          - "Safe-L2-v130-executionPaths.conf"
          - "Safe-L2-v130-selfCalls.conf"
          - "Safe-L2-v130-noStateChange.conf"
          - "Safe-L2-v130-configLockGuard.conf"
          - "Safe-L2-v130-ownerlessSafeGuard.conf"
          - "Safe-L2-v150-executionPaths.conf"
          - "Safe-L2-v150-selfCalls.conf"
          - "Safe-L2-v150-noStateChange.conf"
          - "Safe-L2-v150-configLockGuard.conf"
          - "Safe-L2-v150-ownerlessSafeGuard.conf"
          - "Safe-v150-executionPaths.conf"
          - "Safe-v150-selfCalls.conf"
          - "Safe-v150-noStateChange.conf"
          - "Safe-v150-configLockGuard.conf"
          - "Safe-v150-ownerlessSafeGuard.conf"
          - "Safe-v150-vetoLandsOnDelay.conf"
          - "Delay-delayOwnerGuard.conf"
          - "Delay-SafeL2-v150-delayOwnerGuard.conf"
          - "Delay-Safe-v150-delayOwnerGuard.conf"
          - "Governor-veto.conf"
          - "Governor-proposalThreshold.conf"
          - "Governor-settings.conf"
          - "Governor-voting.conf"
          - "Governor-tallies.conf"
          - "Delay-devopsEndToEnd.conf"
          - "Delay-SafeL2-v141-devopsEndToEnd.conf"
          - "Delay-SafeL2-v130-devopsEndToEnd.conf"
          - "Delay-SafeL2-v150-devopsEndToEnd.conf"
          - "Delay-Safe-v150-devopsEndToEnd.conf"
          - "Delay-vetoSignedPath.conf"
          - "Delay-SafeL2-v150-vetoSignedPath.conf"
          - "Delay-Safe-v150-vetoSignedPath.conf"
          - "Delay-proposerToOwnerlessSettings.conf"
          - "Delay-SafeL2-v141-proposerToOwnerlessSettings.conf"
          - "Delay-SafeL2-v150-proposerToOwnerlessSettings.conf"
          - "Delay-Safe-v150-proposerToOwnerlessSettings.conf"
          - "Delay-SafeL2-v130-proposerToOwnerlessSettings.conf"
          - "Governor-vetoEndToEnd.conf"
          - "TermToken-supply.conf"
      fail-fast: false
    steps:
      # 2.1.0 is not tagged, so there are no guards to pull from a tag.
      - uses: actions/checkout@v4
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - id: pythonversion
        run: echo "version=$(grep python .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pythonversion.outputs.version }}
      # The confs resolve their `packages` remappings against
      # packages/evm/node_modules, so the install has to land there.
      - run: yarn install --immutable
        working-directory: ./packages/evm
      - run: |
          python3 certora/toolchain_test.py
          pip3 install -r "$(python3 certora/toolchain.py '2.1.0/${{ matrix.ruleset }}' --field requirements)"
        working-directory: ./packages/evm
      # 0.8.6 for the Delay and Roles scenes; 0.7.6 for the Safe scenes,
      # matching the deployed GnosisSafe v1.3.0, GnosisSafeL2 v1.3.0, Safe
      # v1.4.1, SafeL2 v1.4.1, Safe v1.5.0 and SafeL2 v1.5.0 singletons.
      # Governor-veto and Governor-vetoEndToEnd mix compilers through their
      # `solc_map`, which names solc8.24 (the constant-quorum Governor from
      # term-finance-ops-contracts PR 1096), solc8.20 (TERM's upgrade
      # implementation) and solc8.6; Governor-proposalThreshold's,
      # Governor-settings', Governor-voting's and Governor-tallies' name
      # solc8.24 and solc8.20; Delay-devopsEndToEnd's, and its
      # Delay-SafeL2-v141-, Delay-SafeL2-v130-, Delay-SafeL2-v150- and
      # Delay-Safe-v150- copies', name solc7.6, solc8.6 and solc8.20; the
      # Safe-, Safe-v141-, Safe-L2-v141-, Safe-L2-v130-, Safe-L2-v150- and
      # Safe-v150- configLockGuard confs, the Safe-, Safe-L2-v141-,
      # Safe-L2-v130-, Safe-L2-v150- and Safe-v150- ownerlessSafeGuard confs,
      # the Safe-v141- and Safe-v150- vetoLandsOnDelay confs,
      # Delay-delayOwnerGuard's and
      # Delay-vetoSignedPath's and their Delay-SafeL2-v150- and
      # Delay-Safe-v150- copies, and
      # Delay-proposerToOwnerlessSettings's and its Delay-SafeL2-v141-,
      # Delay-SafeL2-v130-, Delay-SafeL2-v150- and Delay-Safe-v150- copies'
      # name solc7.6 and solc8.6; and TermToken-supply names solc8.20 through `solc`. So those
      # names are put on PATH too.
      - run: |
          solc-select install 0.8.6 && solc-select install 0.7.6 && solc-select install 0.8.20 && solc-select install 0.8.24
          mkdir -p "$HOME/solc-bin"
          for v in 0.8.24 0.8.20 0.8.6 0.7.6; do
            ln -sf "$HOME/.solc-select/artifacts/solc-$v/solc-$v" "$HOME/solc-bin/solc${v#0.}"
          done
          echo "$HOME/solc-bin" >> "$GITHUB_PATH"
        working-directory: ./packages/evm
      - run: |
          certoraRun "./certora/2.1.0/confs/${{ matrix.ruleset }}" \
            --msg "${{ github.ref_name }} - 2.1.0/${{ matrix.ruleset }} - ${{ github.sha }}" \
            --wait_for_results all \
            --rule_sanity basic
        working-directory: ./packages/evm
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
          SOLC_VERSION: ${{ startsWith(matrix.ruleset, 'Safe-') && '0.7.6' || '0.8.6' }}
