name: Formal Verification
on: [push]
permissions:
  contents: read
concurrency:
  # Per-commit group on main: only one queued run is allowed per group, so a
  # shared group would let a later main push supersede a queued one — and the
  # cancelled push's range would never be checked for contract changes.
  group: fv-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # On the default branch, diff the pushed range; the per-commit
          # concurrency group guarantees every range gets its own run. If the
          # old tip is unresolvable (force-push), fail open and verify.
          # On other branches, diff the merge-base with the default branch:
          # superseded runs make per-push ranges unreliable there, and the
          # branch's full delta is what a merge would bring anyway.
          if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "contracts=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base="$BEFORE"
          else
            # actions/checkout only fetches the pushed ref, so the default branch
            # tracking ref may be absent; fetch it before computing the merge-base.
            git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          # Verification must run when contract sources, specs, or compiler
          # settings change — or when a dependency bump actually affects
          # bytecode (a Solidity library) or the prover itself (certora-cli).
          # JS-only dependency bumps in package.json/yarn.lock skip it. Edits to
          # this workflow are deliberately NOT a trigger: they cannot change
          # contract bytecode, so action/node PRs must not pay for the full
          # prover matrix.
          soldeps='@gnosis\.pm/safe-contracts|@gnosis\.pm/zodiac|@gnosis\.pm/mock-contract|@openzeppelin/contracts|certora-cli'
          if echo "$changed" | grep -qE '^packages/evm/(contracts/|certora/|hardhat\.config\.ts$)'; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          elif git diff "$base" HEAD -- packages/evm/package.json packages/evm/yarn.lock packages/evm/requirements.txt | grep -E '^[+-]' | grep -qE "$soldeps"; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  formal-verification:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    strategy:
      matrix:
        ruleset:
          - "Roles-callTargetAccess.conf"
          - "Roles-callTargetExecution.conf"
          - "Roles-callTargetMultisend.conf"
          - "Roles-callTargetParams.conf"
          - "Roles-callTargetPermissions.conf"
          - "Roles-remediation.conf"
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: nodeversion
        run: echo "version=$(grep nodejs .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - id: pythonversion
        run: echo "version=$(grep python .tool-versions | sed -e 's/[^[:space:]]*[[:space:]]*//')" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodeversion.outputs.version }}
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pythonversion.outputs.version }}
      # The confs resolve their `packages` remappings against
      # packages/evm/node_modules, so the install has to land there.
      - run: yarn install --immutable
        working-directory: ./packages/evm
      - run: pip3 install -r requirements.txt
        working-directory: ./packages/evm
      - run: solc-select install ${SOLC_VERSION}
        working-directory: ./packages/evm
        env:
          SOLC_VERSION: "0.8.6"
      - run: |
          certoraRun "./certora/confs/${{ matrix.ruleset }}" \
            --msg "${{ github.ref_name }} - ${{ matrix.ruleset }} - ${{ github.sha }}" \
            --wait_for_results all \
            --rule_sanity basic
        working-directory: ./packages/evm
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
          SOLC_VERSION: "0.8.6"
